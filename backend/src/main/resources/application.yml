server:
  port: 8081

spring:
  application:
    name: ethics-sra-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ethics_sra}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    # locations: classpath:db/migration
    # 库中已有表但未执行过 Flyway 时（无 flyway_schema_history）可自动 baseline，避免启动失败
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

jwt:
  secret: ${JWT_SECRET:ethics-sra-dev-secret-change-in-production-min-32-chars!!}
  expiration-ms: 86400000

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8001}
  backup-path: ${BACKUP_PATH:./data/backups}
  upload-path: ${UPLOAD_PATH:./data/uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  # 附件存储：local=本机目录；minio=MinIO（S3 兼容），适合 Docker 部署
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${UPLOAD_PATH:./data/uploads}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:ethics-sra}
      region: ${MINIO_REGION:us-east-1}

ai:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
    base-url: https://dashscope.aliyuncs.com/api/v1
    model: ${AI_MODEL:qwen-plus}
    max-tokens: ${AI_MAX_TOKENS:2000}
    temperature: ${AI_TEMPERATURE:0.7}
    timeout: ${AI_TIMEOUT:30}

logging:
  file:
    name: ${LOG_FILE:./logs/ethics-sra.log}
  level:
    root: INFO
    com.ethicssra: DEBUG
